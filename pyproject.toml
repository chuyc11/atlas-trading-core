[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-core"
version = "4.0.0"
description = "File-backed virtual trading research core for the global briefing workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
]

[project.scripts]
trading-core = "trading_core.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_core*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:A-share trading calendar file unavailable; using weekday fallback only:RuntimeWarning",
]
