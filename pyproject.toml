[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-core"
version = "0.9.8"
description = "File-backed virtual trading research core for the global briefing workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
trading-core = "trading_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_core*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
