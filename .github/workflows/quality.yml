name: trading-core-quality

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest
          tests/test_global_briefing_integration.py
          tests/test_global_briefing_integration_robustness.py
          tests/test_signal_schema.py
          tests/test_entrypoint.py
          tests/test_macro_signal_refresh.py
          tests/test_promotion_gate.py
          tests/test_promotion_evidence.py
          tests/test_cli_stage_boundaries.py
          tests/test_a_share_gated_build_execution_plan.py
          tests/test_a_share_gated_build_execution_record.py
          tests/test_a_share_build_repeatability_execution_plan.py
          tests/test_a_share_build_repeatability_execution_record.py
          tests/test_a_share_v36_secret_scan.py
          tests/test_a_share_v36_supply_chain.py
          tests/test_calendar.py
          tests/test_consistency_checker.py
          tests/test_backtest_consistency_checker.py
          tests/test_data_package_validator.py
          tests/test_file_paths.py
          tests/test_v36_evidence_policy.py

  dependency-and-static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pip-audit==2.10.1 bandit==1.9.4 detect-secrets==1.5.0 cyclonedx-bom==6.0.0
      - name: Generate fail-closed V36 security evidence
        run: python -m trading_core.security.v36_evidence
      - name: Generate dependency SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trading-core-security-evidence
          path: |
            data/security_evidence/
            sbom.cdx.json

  full-regression:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest --junitxml=full-regression.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trading-core-full-regression
          path: full-regression.xml
