name: trading-core-quality

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff==0.15.12
      - run: ruff check src tests scripts

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[types]"
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m smoke

  dependency-and-static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pip-audit==2.10.1 bandit==1.9.4 detect-secrets==1.5.0 cyclonedx-bom==6.0.0
      - name: Generate fail-closed V36 security evidence
        run: python -m trading_core.security.v36_evidence
      - name: Generate dependency SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trading-core-security-evidence
          path: |
            data/security_evidence/
            sbom.cdx.json

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest -n auto
          --junitxml=full-regression.xml
          --cov=src/trading_core
          --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trading-core-full-regression
          path: |
            full-regression.xml
            coverage.xml

  clean-wheel-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and install the wheel in a clean environment
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "${RUNNER_TEMP}/trading-core-wheel"
          "${RUNNER_TEMP}/trading-core-wheel/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/trading-core-wheel/bin/trading-core" --version
      - name: Verify packaged configs, Parquet IO, and the operational CLI
        shell: bash
        run: |
          workspace="${RUNNER_TEMP}/trading-core-workspace"
          mkdir -p "${workspace}/work/global-briefing/data"
          : > "${workspace}/work/global-briefing/data/macro_signals-2026-08-01.jsonl"
          "${RUNNER_TEMP}/trading-core-wheel/bin/trading-core" load-macro \
            --workspace-root "${workspace}" \
            --date 2026-08-01 \
            --dry-run \
            --allow-empty
          "${RUNNER_TEMP}/trading-core-wheel/bin/python" - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd
          from trading_core.config_loader import load_all_configs

          configs = load_all_configs()
          assert len(configs) == 8
          target = Path(os.environ["RUNNER_TEMP"]) / "trading-core-wheel" / "roundtrip.parquet"
          expected = pd.DataFrame({"symbol": ["510300.SH"], "close": [4.2]})
          expected.to_parquet(target, index=False)
          actual = pd.read_parquet(target)
          assert actual.to_dict("records") == expected.to_dict("records")
          PY
