name: trading-core-quality

on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: >-
          python -m pytest
          tests/test_global_briefing_integration.py
          tests/test_global_briefing_integration_robustness.py
          tests/test_signal_schema.py
          tests/test_entrypoint.py
          tests/test_macro_signal_refresh.py
          tests/test_promotion_gate.py
          tests/test_promotion_evidence.py
          tests/test_cli_stage_boundaries.py
          tests/test_a_share_gated_build_execution_plan.py
          tests/test_a_share_gated_build_execution_record.py
          tests/test_a_share_build_repeatability_execution_plan.py
          tests/test_a_share_build_repeatability_execution_record.py
          tests/test_a_share_v36_secret_scan.py
          tests/test_a_share_v36_supply_chain.py

  dependency-and-static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pip-audit==2.9.0 bandit==1.8.6 detect-secrets==1.5.0 cyclonedx-bom==6.0.0
      - name: Generate fail-closed V36 security evidence
        run: python -m trading_core.security.v36_evidence
      - name: Generate dependency SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-core-security-evidence
          path: |
            data/security_evidence/
            sbom.cdx.json

  full-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: python -m pytest --junitxml=full-regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-core-full-regression
          path: full-regression.xml
